apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: proxy
  labels:
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/part-of: eehub-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/part-of: eehub-proxy
  ports:
    - name: http
      protocol: TCP
      port: 8191
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: proxy
  labels:
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/part-of: eehub-proxy
spec:
  # FlareSolverr processes browser challenges under sustained load. Keep two
  # replicas so one saturated browser process does not block all requests.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
      app.kubernetes.io/part-of: eehub-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr
        app.kubernetes.io/part-of: eehub-proxy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8191
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: info
            - name: LOG_FILE
              value: none
            - name: LOG_HTML
              value: "false"
            - name: CAPTCHA_SOLVER
              value: none
            - name: TZ
              value: Asia/Shanghai
            - name: PORT
              value: "8191"
            - name: HOST
              value: 0.0.0.0
            - name: PROXY_URL
              value: http://resin.proxy.svc.cluster.local:2260
            - name: PROXY_USERNAME
              value: flaresolverr
            - name: PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resin-secret
                  key: RESIN_PROXY_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
